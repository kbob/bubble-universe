<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Square with Opacity Control</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: transparent;
            border-radius: 0;
            box-shadow: none;
            border: none;
            margin: 0;
            padding: 0;
            z-index: 100;
        }

        .control-panel[open] {
            background-color: rgba(40, 40, 40, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 0 8px 8px 0;
            box-shadow: 4px 4px 16px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: none;
            border-top: none;
        }

        details, summary {
            margin: 0;
            padding: 0;
        }

        summary {
            list-style: none;
        }
        
        summary::-webkit-details-marker {
            display: none;
        }

        .disclosure-triangle {
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: left;
            user-select: none;
            background: transparent;
            border: none;
        }

        .disclosure-triangle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .disclosure-triangle svg {
            width: 18px;
            height: 18px;
            fill: #fff;
            transition: transform 0.2s ease;
        }

        .control-panel[open] .disclosure-triangle svg {
            transform: rotate(90deg);
        }

        .panel-content {
            padding: 12px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-panel label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaa;
            margin-bottom: 4px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reset-btn {
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .reset-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .reset-btn:disabled {
            background: transparent;
        }

        .reset-btn svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        input[type="range"] {
            width: 140px;
            cursor: pointer;
            accent-color: #ff4444;
        }

        .value-display {
            font-size: 12px;
            width: 35px;
            text-align: right;
            font-family: monospace;
            color: #fff;
        }
    </style>
</head>
<body>
    <canvas id="myCanvas"></canvas>

    <details id="controlPanel" class="control-panel">
        <summary class="disclosure-triangle">
            <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z" />
            </svg>
        </summary>
        <div class="panel-content">
            <label for="opacitySlider">Square Transparency</label>
            <div class="slider-container">
                <button id="resetBtn" class="reset-btn" aria-label="Reset opacity to 1.0" disabled>
                    <svg viewBox="0 0 24 24">
                        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                    </svg>
                </button>
                <input type="range" id="opacitySlider" min="0" max="1" step="0.01" value="1">
                <span id="opacityValue" class="value-display">1.00</span>
            </div>
        </div>
    </details>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('opacitySlider');
        const opacityValue = document.getElementById('opacityValue');
        const resetBtn = document.getElementById('resetBtn');

        let currentOpacity = 1;
        const squareSize = 100;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawSquare();
        }

        function drawSquare() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const x = (canvas.width - squareSize) / 2;
            const y = (canvas.height - squareSize) / 2;
            
            ctx.globalAlpha = currentOpacity;
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(x, y, squareSize, squareSize);
            ctx.globalAlpha = 1.0;
        }

        function updateResetState() {
            resetBtn.disabled = currentOpacity == 1;
        }

        // Initial setup & resize handling
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Slider input handler
        slider.addEventListener('input', (e) => {
            currentOpacity = parseFloat(e.target.value);
            opacityValue.textContent = currentOpacity.toFixed(2);
            drawSquare();
            updateResetState();
        });

        // Reset button handler
        resetBtn.addEventListener('click', () => {
            currentOpacity = 1;
            slider.value = 1;
            opacityValue.textContent = '1.00';
            drawSquare();
            updateResetState();
        });
    </script>
</body>
</html>
